<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Puter.js Image Generator — Selayang Pandang</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b1326;color:#e6edf3;min-height:100vh;padding:2rem}
    .wrap{max-width:960px;margin:0 auto}
    h1{font-size:1.5rem;color:#f59e0b;margin-bottom:.3rem}
    .sub{color:#6b7280;font-size:.82rem;margin-bottom:1.2rem;line-height:1.5}
    button{display:inline-flex;align-items:center;gap:8px;background:#f59e0b;color:#0b1326;border:none;border-radius:10px;padding:10px 22px;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:8px;margin-right:8px;transition:background 120ms}
    button:hover:not(:disabled){background:#fbbf24}
    button:disabled{background:#374151;color:#6b7280;cursor:not-allowed}
    #status{margin:.8rem 0;padding:10px 14px;border-radius:8px;font-size:.8rem;display:none;line-height:1.6}
    .ok{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#86efac}
    .err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .info{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
    .bar{background:#162447;border:1px solid #2a3f6f;border-radius:8px;padding:10px 14px;margin-bottom:1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .bar select{background:#0d1b2e;color:#e6edf3;border:1px solid #2a3f6f;border-radius:6px;padding:6px 10px;font-size:.82rem}
    #log{margin-top:.8rem;font-family:'Courier New',monospace;font-size:.7rem;color:#374151;max-height:340px;overflow-y:auto;background:#0d1117;border:1px solid #1e3a5f;border-radius:8px;padding:10px}
    .lo{color:#86efac}.le{color:#fca5a5}.li{color:#93c5fd}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:.8rem}
    .card{background:#162447;border:1px solid #2a3f6f;border-radius:10px;padding:10px 12px}
    .card.done{border-color:#22c55e}.card.er{border-color:#ef4444}.card.wn{border-color:#f59e0b}
    .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .cn{font-weight:700;color:#f59e0b;font-size:.72rem}
    .cl{font-weight:700;font-size:.76rem;color:#e6edf3}
    .cp{width:100%;aspect-ratio:16/9;background:#0d1b2e;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#374151;overflow:hidden}
    .cp img{width:100%;height:100%;object-fit:cover}
    .cb{font-size:.62rem;padding:2px 6px;border-radius:99px;margin-top:4px;display:inline-block}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Puter.js — Free Image Generator</h1>
  <p class="sub">Selayang Pandang DPD Komnas PPLH Karawang · 26 Shot Reference + 5 Scenes</p>

  <button id="loginBtn" onclick="doLogin()">🔐 Login Puter</button>
  <button id="loadBtn"  onclick="doLoadModels()" disabled>📋 Load Models</button>
  <div id="status"></div>
  <div class="bar" id="modelBar" style="display:none">
    <span style="font-size:.78rem;color:#9ca3af">Model:</span>
    <select id="modelSelect"></select>
    <span id="modelHint" style="font-size:.72rem;color:#6b7280"></span>
    <button id="genBtn" onclick="doGenerate()" disabled>▶ Generate All</button>
  </div>
  <div id="log"></div>
  <div class="grid" id="grid"></div>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// PROMPTS — 26 SHOT REFERENCE + 5 CINEMATIC SCENES
// ═══════════════════════════════════════════════════════════════════════════════

const SCENES = [
  {id:'SCENE-01',lbl:'PEMBUKA',     prompt:'Cinematic aerial golden hour establishing shot of Karawang West Java, endless green rice fields in foreground, distant industrial factories glowing amber orange, dramatic god rays in warm sunset sky, teal and amber colour grade, slow drone aerial wide shot, film still photorealistic 8K ultra-detailed'},
  {id:'SCENE-02',lbl:'DATA & FAKTA', prompt:'Futuristic editorial data visualization 2.6M population plus 1500 tons daily garbage crisis: giant amber neon number 2600000 above stylized overflowing garbage truck with bold red 1500 TON text label on dark navy background, warm orange bokeh particles floating, editorial documentary 4K'},
  {id:'SCENE-03',lbl:'TPA JALUPANG', prompt:'Cinematic aerial wide drone shot of massive overflowing garbage landfill in Karawang, mountains of colourful plastic refuse stretching to horizon, hazy overcast grey sky, storm approaching, slow descending drone, desaturated cold grade, urban decay documentary wide 8K, no people'},
  {id:'SCENE-04',lbl:'DAMPAK',       prompt:'Cinematic aerial wide documentary: wide Indonesian river with scattered floating refuse and plastic debris, small wooden boat navigating mid-distance, overcast sky, cool desaturated colour grade, environmental landscape documentary 8K, no people'},
  {id:'SCENE-05',lbl:'PENUTUP',      prompt:'Cinematic warm hopeful golden hour: Indonesian community waste bank bank sampah in Karawang, villagers sorting plastic recyclables, green plants and morning golden sunlight, warm orange and green grading, uplifting inspirational mood, photorealistic 4K'},
];

const SHOTS = [
  {id:'SR-01', lbl:'Logo Open',            sc:'PEMBUKA',     prompt:'Minimal cinematic opening title card: deep navy matte background, centred bold white condensed text KOMNAS PPLH KARAWANG, soft inner glow, 16:9 letterbox, no decoration, film opening still 4K'},
  {id:'SR-02', lbl:'Aerial Est.',           sc:'PEMBUKA',     prompt:'Cinematic aerial golden hour establishing Karawang West Java: endless green rice fields, distant factories glowing amber, warm sunset sky, dramatic god rays, teal and amber colour grade, slow drone wide 8K film still'},
  {id:'SR-03', lbl:'Timelapse',             sc:'PEMBUKA',     prompt:'Cinematic time-lapse Karawang skyline blue hour to golden hour transition, traffic light-trail streaks along roadways, mountain ridge silhouette, warm-cool dual tone colour grade, 4K timelapse still'},
  {id:'SR-04', lbl:'Handheld Waste Drop',   sc:'PEMBUKA',     prompt:'Slow motion B-roll still: anonymous hands tossing crumpled plastic waste into overflowing public bin, warm afternoon ambient light, shallow depth of field, urban documentary style 4K, no face'},
  {id:'SR-05', lbl:'Title Darwin Sampah',   sc:'PEMBUKA',     prompt:'Bold cinematic typography title card: massive bold condensed white text DARURAT SAMPAH KARAWANG centred on solid matte black background, thin amber accent rule below, film poster style, no clutter 4K'},
  {id:'SR-06', lbl:'Infographic 2.6M',      sc:'DATA & FAKTA',prompt:'Cinematic editorial infographic still: giant amber neon number 2600000 on dark navy background, tiny truck icon at lower right, warm bokeh particles, shallow depth of field editorial 4K'},
  {id:'SR-07', lbl:'Infographic 1500 ton',  sc:'DATA & FAKTA',prompt:'Cinematic dramatic editorial infographic: giant bold red text 1.500 TON-HARI on dark navy background, subtle red vibration motion blur as if overwhelming, warm bokeh, ediorial 4K'},
  {id:'SR-08', lbl:'Close-up Dumpster',     sc:'DATA & FAKTA',prompt:'Close-up documentary still: overflowing refuse bin interior, piled mixed plastic and paper waste, half-light from street lamp above, shallow DOF, cool desaturated colour 4K texture'},
  {id:'SR-09', lbl:'Truck Convoy',          sc:'DATA & FAKTA',prompt:'Cinematic wide shot: convoy of overloaded refuse lorries queuing on muddy road at landfill entrance, multiple lorries into background, desaturated blue-grey cool colour, aerial documentary news aesthetic 4K'},
  {id:'SR-10', lbl:'Street Overflow',       sc:'DATA & FAKTA',prompt:'Cinematic street wide documentary: person walking past overflowing refuse bins on residential sidewalk, apartment buildings in background, desaturated colour, urban documentary wide 4K'},
  {id:'SR-11', lbl:'Title TPA Jalupang',    sc:'TPA JALUPANG', prompt:'Cinematic title card still: bold white text SEBAGIAN BESAR BERAKHIR DI TPA JALUPANG centred on semi-transparent dark navy bar at bottom frame, dark aerial background, documentary title card 4K'},
  {id:'SR-12', lbl:'Aerial Wide TPA',       sc:'TPA JALUPANG', prompt:'Cinematic aerial drone ultrawide shot of Karawang garbage landfill TPA Jalupang, mountains of colourful compacted refuse stretching to horizon, hazy overcast sky, smoke haze, slow descending drone, 8K photorealistic'},
  {id:'SR-13', lbl:'Flyover TPA Layer',     sc:'TPA JALUPANG', prompt:'Cinematic drone flyover tracking: compacted refuse mountains in rainbow layers, dramatic grey stormy sky overhead, storm approaching horizon, drone footage aesthetic, photorealistic 8K'},
  {id:'SR-14', lbl:'Macro Texture',         sc:'TPA JALUPANG', prompt:'Cinematic macro texture still: surface of decomposing refuse pile showing layered plastic sheets and food packaging, golden afternoon sunlight on edges, shallow DOF, environmental documentary detail 4K'},
  {id:'SR-15', lbl:'Leachate Drainage',     sc:'TPA JALUPANG', prompt:'Cinematic slow sideways tracking: dark wastewater seeping from refuse pile along muddy drainage channel, overcast natural light, cool desaturated colour grade, documentary environmental 4K'},
  {id:'SR-16', lbl:'Resident Portrait TPA', sc:'TPA JALUPANG', prompt:'Cinematic medium portrait: anonymous local resident in casual clothing and face mask, expression of concern, standing near refuse perimeter, dramatic overcast side light, shallow DOF, no identifying features 4K'},
  {id:'SR-17', lbl:'Truck Tip Action',      sc:'TPA JALUPANG', prompt:'Cinematic frozen action still: refuse lorry tipping fresh load at disposal point, refuse frozen mid-air over refuse mountain, dust in daylight, dramatic grey overcast sky, documentary frozen moment 4K'},
  {id:'SR-18', lbl:'Night Fire Edge',       sc:'TPA JALUPANG', prompt:'Cinematic wide low-light night: small fire burning at landfill refuse edge producing warm orange glow into dark overcast sky, weathered ground debris foreground, long exposure aesthetic, moody cinematic 4K'},
  {id:'SR-19', lbl:'Interview Portrait',    sc:'TPA JALUPANG', prompt:'Cinematic documentary interview portrait: community member in casual clothes and face mask before landfill backdrop, natural overcast diffused side light, muted desaturated colour, no identifying features portrait 4K'},
  {id:'SR-20', lbl:'Urban Drainage',        sc:'DAMPAK',        prompt:'Cinematic urban landscape: street-level drainage canal lined with floating refuse material, multi-storey building silhouettes in background on both banks, overcast natural light, desaturated cool colour, documentary still 4K'},
  {id:'SR-21', lbl:'Rainy Street Overflow', sc:'DAMPAK',        prompt:'Cinematic street shot golden hour: narrow Indonesian residential street with rain-slicked asphalt, overflowing curbside bins spilling refuse, warm yellow sodium street lamp glow, shallow puddles, moody atmospheric 4K'},
  {id:'SR-22', lbl:'Aerial River Est.',     sc:'DAMPAK',        prompt:'Cinematic aerial wide landscape: wide river surface dotted with floating refuse and scattered debris, small wooden cargo boat mid-distance navigating between patches, high contrast aerial composition, environmental documentary 4K'},
  {id:'SR-23', lbl:'Children Golden Hour',  sc:'DAMPAK',        prompt:'Cinematic golden hour still: people carrying woven baskets walking along quiet residential street edge, long warm shadow from setting sun, peaceful tableau with warm soft golden light, photorealistic cinematic 4K'},
  {id:'SR-24', lbl:'Night Smoke Industry',  sc:'DAMPAK',        prompt:'Cinematic wide night shot: distant industrial facility at refuse site edge emitting faint orange haze glow into dark sky visible from residential area in foreground, weathered concrete road and grass, moody cinematic 4K'},
  {id:'SR-25', lbl:'Portrait Dampak',       sc:'DAMPAK',        prompt:'Cinematic environmental portrait still: community resident wearing cloth face mask near industrial zone perimeter boundary, midday harsh sunlight, shallow DOF, no identifying features documentary photography 4K'},
];

// ═══════════════════════════════════════════════════════════════════════════════
// MODEL NAME REMAP — what listModels returns  →  what txt2img accepts
// Source: https://developer.puter.com/tutorials/free-unlimited-gpt-image-api/
// ═══════════════════════════════════════════════════════════════════════════════
const MODEL_REMAP = {
  // OpenRouter returns these as IDs — strip provider/prefix and remap
  'openrouter:openai/gpt-5-image':    'gpt-image-2',
  'openrouter:openai/gpt-5.4-image-2':'gpt-image-2',
  'openrouter:openai/gpt-5.3-image':  'gpt-image-2',
  'openrouter:openai/gpt-5-image-mini':'gpt-image-1-mini',
  'openrouter:openai/gpt-image-2':    'gpt-image-2',
  'openrouter:openai/gpt-image-1.5':  'gpt-image-1.5',
  'openrouter:openai/gpt-image-1':    'gpt-image-1',
  'openrouter:openai/gpt-image-1-mini':'gpt-image-1-mini',
  'openrouter:openai/dall-e-3':       'dall-e-3',
  'openrouter:google/gemini-2.5-flash-image-preview':'gemini-2.5-flash-image-preview',
  'openrouter:google/gemini-3.1-flash-image-preview':'gemini-2.5-flash-image-preview',
  'openrouter:google/gemini-3-pro-image-preview':   'gemini-3-pro-image-preview',
  'openrouter:google/gemini-2.0-flash-image-preview':'gemini-2.5-flash-image-preview',
  // Strip-only fallback: remove prefix + provider/
  'openrouter:google/gemini-2.0-flash-image':       'gemini-2.5-flash-image-preview',
  'openrouter:google/gemini-2.5-flash-image':         'gemini-2.5-flash-image-preview',
};
// Fallback: strip everything up to "/" and "openrouter:" prefix if not in map
function normalizeModel(rawId) {
  rawId = (rawId || '').replace(/^openrouter:/,'');
  // google/gemini-... → gemini-...
  if (rawId.startsWith('google/')) rawId = rawId.replace(/^google\//,'');
  // Remove trailing .0
  rawId = rawId.replace(/\.0$/, '');
  // Handle gemini-3-pro → gemini-3-pro-image-preview (txt2img needs image models)
  if (rawId === 'gemini-3-pro-image') rawId = 'gemini-3-pro-image-preview';
  if (rawId === 'gemini-3-flash-image') rawId = 'gemini-2.5-flash-image-preview';
  return rawId;
}

// ═══════════════════════════════════════════════════════════════════════════════
let loggedIn=false, results=[], modelEntries=[];

const loginBtn    = document.getElementById('loginBtn');
const loadBtn     = document.getElementById('loadBtn');
const genBtn      = document.getElementById('genBtn');
const modelSelect = document.getElementById('modelSelect');
const modelBar    = document.getElementById('modelBar');
const modelHint   = document.getElementById('modelHint');
const statusDiv   = document.getElementById('status');
const logDiv      = document.getElementById('log');
const gridDiv     = document.getElementById('grid');

function log(m,t='i'){const e=document.createElement('div');e.className='l'+t;e.textContent=`[${new Date().toLocaleTimeString()}] ${m}`;logDiv.appendChild(e);logDiv.scrollTop=logDiv.scrollHeight}
function ss(m,t='i'){statusDiv.textContent=m;statusDiv.className=t;statusDiv.style.display='block'}

function renderCards(){
  gridDiv.innerHTML='';
  [...SCENES,...SHOTS].forEach(it=>{
    gridDiv.innerHTML += `<div class="card" id="card-${it.id}">
<div class="ch"><span class="cn">${it.id}</span><span class="cl">${it.lbl}</span></div>
<div style="font-size:.6rem;color:#6b7280;margin-bottom:4px">${it.sc}</div>
<div class="cp" id="img-${it.id}">🎬</div>
<span class="cb" style="background:#1e3a5f;color:#93c5fd" id="b-${it.id}">idle</span>
</div>`;
  });
  log('✓ Rendered '+(SCENES.length+SHOTS.length)+' cards.','o');
}

// ═══════════════════════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════════════════════
async function doLogin(){
  loginBtn.disabled=true;loginBtn.textContent='⏳ Opening popup…';log('auth.signIn()…');
  try{
    const r = await puter.auth.signIn();
    log('✅ Login OK! token='+String(r.token||r).slice(0,50),'o');
    loggedIn=true;loginBtn.textContent='✅ Logged in';loadBtn.disabled=false;
    ss('✅ Login ok! Klik "Load Models" bagian bawah.','o');
  }catch(e){
    log('❌ '+e.message,'e');ss('❌ Login fail: '+e.message,'e');
    loginBtn.disabled=false;loginBtn.textContent='🔐 Login (retry)';
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// LOAD + NORMALIZE MODELS
// docs: https://developer.puter.com/tutorials/free-unlimited-gpt-image-api/
// ═══════════════════════════════════════════════════════════════════════════════
async function doLoadModels(){
  loadBtn.disabled=true;loadBtn.textContent='⏳…';log('ai.listModels()…');
  try{
    const rawModels = await puter.ai.listModels();
    log('listModels() returned '+rawModels.length+' models.','i');

    // Step 1: forward-map using MODEL_REMAP, Step 2: try normalizeModel
    const seen = new Set();
    modelEntries = [];

    for (const m of rawModels) {
      const rid = (m && m.id) || '';
      // try explicit remap first
      let name = MODEL_REMAP[rid];
      // if not in map, normalize it
      if (!name) name = normalizeModel(rid);
      // only keep plausible image model names
      if (!name) continue;
      if (!/(gpt-image|dall-e|gemini|stable|flux|imagen|seedream)/i.test(name)) continue;
      if (seen.has(name)) continue;
      seen.add(name);
      modelEntries.push({ rawId: rid, name });
    }

    // fallback: inject known good model names anyway (they cost nothing to try)
    ['gpt-image-2','gpt-image-1.5','gemini-2.5-flash-image-preview','gemini-3-pro-image-preview','dall-e-3'].forEach(name=>{
      if (!seen.has(name)) modelEntries.push({ rawId:'[known-good]', name });
    });

    if (!modelEntries.length) {
      log('WARN: no image models — using free fallback.','e');
    }

    modelSelect.innerHTML = '';
    modelEntries.forEach(e => {
      const o = document.createElement('option');
      o.value = e.name;
      o.textContent = e.name + (e.rawId !== '[known-good]' ? ' ✓' : ' (try)');
      modelSelect.appendChild(o);
    });

    modelBar.style.display='flex';
    genBtn.disabled=false;
    modelHint.textContent = modelEntries.length + ' model(s) ready · User-paid via Puter';

    log('✓ Image models ready to use:','o');
    modelEntries.forEach(e => log('   '+e.name));
    ss('✓ '+modelEntries.length+' model(s) loaded. Pilih model, klik "Generate All".','o');
    loadBtn.textContent='✅ Models loaded';
    loadBtn.disabled=false;
  }catch(e){
    log('❌ listModels error: '+e.message,'e');
    ss('❌ Error loading models, retry.','e');
    loadBtn.disabled=false;loadBtn.textContent='📋 Retry';
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// GENERATE
// ═══════════════════════════════════════════════════════════════════════════════
async function genOne(it){
  const card=document.getElementById('card-'+it.id);
  const img =document.getElementById('img-'+it.id);
  const bdg =document.getElementById('b-'+it.id);
  if(card)card.className='card wn';if(img)img.textContent='⏳';
  if(bdg){bdg.textContent='gen…';bdg.style.cssText='font-size:.62rem;padding:2px 6px;border-radius:99px;margin-top:4px;display:inline-block;background:#1e3a5f;color:#93c5fd'}

  const model = modelSelect.value || '';
  const opts  = { model };
  log('▶ ['+it.id+'] '+it.lbl+' model='+model);

  try{
    const res = await puter.ai.txt2img(it.prompt, opts);
    const url = res?.src || res?.href || '';
    if(url){
      img.innerHTML='<img src="'+url+'" alt="'+it.id+'" loading="lazy" crossorigin="anonymous">';
      if(card)card.className='card done';
      if(bdg){bdg.textContent='✓ done';bdg.style.cssText='font-size:.62rem;padding:2px 6px;border-radius:99px;margin-top:4px;display:inline-block;background:#14532d;color:#86efac'}
      log('✓ ['+it.id+'] '+url.slice(0,60),'o');
      return {id:it.id,lbl:it.lbl,sc:it.sc,url};
    }
    log('⚠️ no url: '+JSON.stringify(res).slice(0,80),'i');
    return {id:it.id,lbl:it.lbl,sc:it.sc,error:'no url'};
  }catch(e){
    if(card)card.className='card er';if(img)img.textContent='❌';
    if(bdg){bdg.textContent='ERR';bdg.style.cssText='font-size:.62rem;padding:2px 6px;border-radius:99px;margin-top:4px;display:inline-block;background:#7f1d1d;color:#fca5a5'}
    log('❌ ['+it.id+'] '+e.message,'e');
    return {id:it.id,lbl:it.lbl,sc:it.sc,error:e.message};
  }
}

async function doGenerate(){
  genBtn.disabled=true;ss('🎨 Generating — 30 images, bisa 5–20 menit…','i');
  log('=== BATCH START ===');results=[];
  const all=[...SCENES,...SHOTS],N=all.length;
  log('Total: '+N+' prompts over selected model: '+(modelSelect.value||'default'),'i');

  for(let i=0;i<N;i++){
    const res=await genOne(all[i]);
    results.push(res);
    if(i<N-1) await new Promise(r=>setTimeout(r,1800));
  }
  const ok=results.filter(r=>r.url).length;
  log('\n=== DONE: '+ok+'/'+N+' images generated ===','o');
  ss('✅ '+ok+'/'+N+' gambar berhasil! Klik tombol Download bawah.','o');

  // Auto-download
  if(!document.getElementById('dlBtn')){
    const dl=document.createElement('button');
    dl.id='dlBtn';dl.textContent='📥 Download Results JSON';dl.onclick=doDl;
    dl.style.cssText+=';margin-top:8px';
    statusDiv.after(dl);
  }
}
function doDl(){
  const b=new Blob([JSON.stringify(results,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='selayang-pandang-images.json';a.click();
  log('📥 results JSON downloaded.','o');
}

// INIT
renderCards();
log("Puter.js loaded — Klik 'Login Puter' untuk mulai.",'i');
</script>
</body>
</html>
